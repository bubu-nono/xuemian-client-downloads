name: Bug report / 问题反馈
name: Bug report / 问题反馈
description: Report a reproducible issue with XueMianTong / 反馈可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve XueMianTong. This issue is public. Do not post passwords, phone numbers, login tokens, resumes, interview content, or other sensitive information.

        感谢帮助改进学面通。此反馈公开可见，请勿填写密码、手机号、登录凭据、简历或面试内容等敏感信息。经核实有效的 Bug 反馈将获得积分奖励。

  - type: input
    id: user_id
    attributes:
      label: XueMianTong user ID / 学面通用户 ID
      description: The website pre-fills this when you are signed in. We use it only to identify your account for follow-up and points rewards. / 登录官网后会自动填入，用于确认账号、跟进问题和发放奖励。
      placeholder: "12345"
    validations:
      required: true

  - type: input
    id: report_language
    attributes:
      label: Report language / 反馈语言
      description: Prefilled from the website when available. / 官网会尽量根据当前语言自动填写。
      placeholder: "zh-CN, en-US, ja-JP, ko-KR"

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 系统平台
      options:
        - Windows x64
        - macOS Apple silicon
        - Website / 官网
        - Other / 其他
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App or website version / 客户端或网页版本
      description: Include the version shown in the app, or the browser name for website issues. / 填写客户端版本；网页问题请填写浏览器名称。
      placeholder: "1.1.5"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened? / 问题描述
      description: Describe one issue in a few sentences. / 请简要描述一个问题。
      placeholder: "When I…, the app… / 当我……时，应用……"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: List the steps that reliably reproduce the issue. / 写出稳定复现问题的操作步骤。
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result / 预期结果与实际结果
      description: What did you expect, and what happened instead? / 你预期发生什么，实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot or safe logs (optional) / 截图或脱敏日志（可选）
      description: Remove personal information before attaching. / 上传前请遮挡个人信息。

  - type: markdown
    attributes:
      value: |
        Reproducible, verified bug reports are eligible for points after review. The amount is determined after the report is verified; submitting an issue does not guarantee a reward.

        可复现且核实有效的 Bug 反馈，经审核后可获得积分；奖励数额以核实结果为准，提交反馈不代表必定获奖。
